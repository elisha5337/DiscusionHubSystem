<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Cool Rooms</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        #rooms-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .room {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 15px;
            width: 200px;
            text-align: center;
            transition: transform 0.2s;
        }

        .room:hover {
            transform: scale(1.05);
        }

        h3 {
            color: #2980b9;
        }
    </style>
</head>

<body>

    <h1>Cool Rooms</h1>

    <div id="rooms-container"></div>

    <script>
        let roomsContainer = document.getElementById('rooms-container');

        let getRooms = async () => {
            let response = await fetch('http://127.0.0.1:8000/api/rooms/');
            let rooms = await response.json();

            for (let i = 0; rooms.length > i; i++) {
                let room = rooms[i];

                let row = `<div class="room">
                            <h3>${room.name}</h3>
                        </div>`;

                roomsContainer.innerHTML += row;
            }
        }

        getRooms();
    </script>

</body>

</html>
