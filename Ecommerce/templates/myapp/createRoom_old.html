 {% extends 'myapp/main.html' %}
{% block content %}

<div class="create-room-container">
    <h2 class="create-room-title">Create a New Room</h2>
    <a class="back-link" href="{{request.META.HTTP_REFERER}}">Go back</a>
    <form method="POST" action="" class="create-room-form">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Create Room" class="submit-button">
    </form>
</div>
 <style>
 .create-room-container {
    text-align: center;
    margin-top: 50px;
    padding: 30px; /* Added padding for better spacing */
    background-color: #f9f9f9; /* Light background for contrast */
    border-radius: 10px; /* Rounded corners */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
}

.create-room-title {
    font-size: 2em; /* Increased title size */
    color: #333; /* Darker text color */
    margin-bottom: 20px; /* Space below the title */
}

.back-link {
    display: inline-block; /* Inline block for better spacing */
    margin-bottom: 20px; /* Space below the link */
    color: #007bff; /* Link color */
    text-decoration: none; /* Remove underline */
}

.back-link:hover {
    text-decoration: underline; /* Underline on hover */
}

.create-room-form {
    display: inline-block; /* Center the form */
    text-align: left; /* Left-align form elements */
    padding: 20px; /* Padding around the form */
    background-color: #ffffff; /* White background for the form */
    border-radius: 8px; /* Rounded corners for the form */
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Shadow for the form */
}

.create-room-form input[type="text"],
.create-room-form input[type="email"],
.create-room-form input[type="password"],
.create-room-form textarea {
    width: 100%; /* Full width inputs */
    padding: 10px; /* Padding inside inputs */
    margin: 10px 0; /* Margin between inputs */
    border: 1px solid #ccc; /* Light border */
    border-radius: 5px; /* Rounded corners for inputs */
    font-size: 1em; /* Font size for inputs */
}

.create-room-form input[type="submit"] {
    background-color: #007bff; /* Button color */
    color: white; /* Button text color */
    border: none; /* No border */
    padding: 10px 20px; /* Padding around the button */
    border-radius: 5px; /* Rounded corners for the button */
    cursor: pointer; /* Pointer cursor on hover */
    font-size: 1em; /* Button font size */
}

.create-room-form input[type="submit"]:hover {
    background-color: #0056b3; /* Darker blue on hover */
}
</style>
{% endblock content %}
