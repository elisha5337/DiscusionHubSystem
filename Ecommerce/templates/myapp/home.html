{% extends 'myapp/main.html' %}

{% block content %}
<style>
    .container {
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        gap: 20px; /* Added gap between columns */
        padding: 20px; /* Added padding around the container */
    }

    .browse {
        background-color: #555555; /* Dark background for the browse section */
        color: white; /* Text color for visibility */
        padding: 10px; /* Padding for content spacing */
        border-radius: 5px; /* Rounded corners for aesthetics */
    }

    .room-list {
        background-color: #f9f9f9; /* Light background for contrast */
        padding: 20px; /* Padding for room list */
        border-radius: 5px; /* Rounded corners */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
    }

    .room-item {
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #fff; /* White background for room items */
    }

    .room-link {
        text-decoration: none;
        color: #333; /* Dark text for room titles */
    }

    .room-title {
        margin: 0; /* Remove default margin from h2 */
    }

    .btn-create-room {
        padding: 10px 20px;
        background-color: #4CAF50; /* Green background for create room button */
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
    }

    .btn-create-room:hover {
        background-color: #45a049; /* Darker green on hover */
    }

    .auth-links a {
        color: #007BFF;
        text-decoration: none;
        margin-right: 10px;
    }

    .auth-links a:hover {
        text-decoration: underline; /* Underline on hover for links */
    }
    .recent-activity {
        background-color: #f9f9f9; /* Light background for contrast */
        border-radius: 8px; /* Rounded corners */
        padding: 10px; /* Padding around the content */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        /* Space above the section */
    }
    .recent-activity h3 {
        font-size: 1.8em; /* Larger font size for the title */
        color: #333; /* Dark color for the title */
        margin-bottom: 10px; /* Space below the title */
    }
    .activity-item {
        border-bottom: 1px solid #eee; /* Divider between activities */
        padding: 10px 0; /* Vertical padding for items */
    }
    .activity-user {
        font-weight: bold; /* Bold for user name */
        color: #007bff; /* Blue color for user name */
    }
    .activity-reply {
        color: #555; /* Gray color for reply text */
        margin-left: 10px; /* Space between user and reply */
    }
    .activity-message {
        margin-top: 5px; /* Space above the message */
        color: #333; /* Dark color for the message */
    }
    .no-activity {
        text-align: center; /* Center align the no activity message */
        color: #888; /* Gray color for the no activity text */
        font-style: italic; /* Italic style for emphasis */
    }
</style>

<div class="container">
    <div>
        {% include 'myapp/browse.html' %}
    </div>
    <div class="room-list">
        <h1 class="page-title">List of Available Rooms</h1>
        <h5>{{ room_count }} rooms available</h5> <!-- Fixed typo: 'availlabe' to 'available' -->

        <div style="text-align: center; margin-bottom: 20px;">
            <a href="{% url 'create_room' %}" class="btn-create-room">Create Room</a>
        </div>

       {% include 'myapp/feedback.html' %}
    </div>

    <div>
        {% include 'myapp/recentActivity.html' %}
    </div>
</div>

</div>
{% endblock content %}
